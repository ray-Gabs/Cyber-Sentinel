# ============================================================
# Cyber Sentinel — Docker Compose (Full Stack)
# ============================================================
# Default services (always started):
#   mongo    — MongoDB 7 (persistent scan/alert storage)
#   redis    — Redis 7 (Celery broker + result backend)
#   backend  — FastAPI + uvicorn (hot-reload via volume mount)
#   celery   — Celery worker (--pool=solo for dev; see note below)
#   frontend — React built with Vite, served by internal nginx
#   zap      — OWASP ZAP daemon (DAST scanner for pentest engine)
#   nginx    — SSL reverse proxy (HTTPS on 443, HTTP→HTTPS on 80)
#
# Optional profile (heavy — start separately when needed):
#   docker-compose --profile wazuh up -d   # Wazuh SIEM manager
#
# Common commands:
#   docker-compose up -d --build     # First run / after Dockerfile changes
#   docker-compose up -d             # Subsequent runs (no rebuild)
#   docker-compose down              # Stop containers (keep volumes)
#   docker-compose down -v           # Stop + wipe volumes (clean slate)
#   docker-compose logs -f backend   # Tail backend logs
#   docker-compose logs -f celery    # Tail Celery worker logs
#   docker-compose logs -f nginx     # Tail nginx / SSL logs
#
# Platform notes:
#   Windows  — Docker Desktop (WSL2 backend). All Linux tools run in containers.
#   Ubuntu   — Install docker.io + docker-compose-plugin, then run as-is.
#              Celery: change --pool=solo to --pool=prefork on dedicated Ubuntu servers.
#   macOS    — Docker Desktop. Add "platform: linux/amd64" if on Apple Silicon.
#
# HTTPS:
#   Dev:  self-signed cert auto-generated on first nginx start.
#         Import nginx_certs:/etc/nginx/certs/server.crt into your browser to trust it.
#   Prod: mount real certs into the nginx_certs volume:
#         server.crt (fullchain) + server.key (private key) → /etc/nginx/certs/
#   Let's Encrypt: set CERT_DOMAIN=yourdomain.com env var on the nginx service.
# ============================================================

networks:
  sentinel-net:
    driver: bridge

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: cyber-sentinel-mongo
    networks:
      - sentinel-net
    ports:
      - "27017:27017"       # exposed for Compass / direct dev access
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis (Celery broker + result backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cyber-sentinel-redis
    networks:
      - sentinel-net
    ports:
      - "6379:6379"         # exposed for direct dev inspection (redis-cli)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI Backend (uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-backend
    networks:
      - sentinel-net
    env_file:
      - .env
    environment:
      # Override .env localhost defaults with Docker service hostnames
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:8888
      # Add the VM's LAN IP so students' browsers are not CORS-blocked.
      # Replace 10.4.89.178 with this VM's actual IP if it changes.
      - CORS_EXTRA_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8888,https://localhost,http://10.4.89.178,http://10.4.89.178:8000,http://10.4.89.178:8888
      - ZAP_API_URL=http://zap:8080
      # Python container settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Lab mode: allow scanning private IPs (student machines on local network)
      - ALLOW_PRIVATE_TARGETS=true
      # First-boot admin seed — only takes effect when the users collection is empty.
      # Set these in .env before the first `docker compose up`. Change password after login.
      - FIRST_ADMIN_USERNAME=${FIRST_ADMIN_USERNAME:-admin}
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-}
      # Wazuh Manager is on the HOST (not in Docker) — use host.docker.internal
      # to reach it. host-gateway resolves to the Docker bridge gateway IP
      # (the host VM's IP from inside the container). Wazuh runs on port 55000.
      - WAZUH_API_URL=https://host.docker.internal:55000
      - WAZUH_VERIFY_SSL=false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux Docker Engine 20.10+ required
    ports:
      - "8000:8000"         # exposed for Swagger UI / direct API testing
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Volume mount: host source → /app so --reload picks up changes without rebuilding
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  # Pool notes:
  #   --pool=solo     → single-threaded; safe on Windows Docker Desktop + WSL2 (default)
  #   --pool=prefork  → multi-process; better on dedicated Ubuntu/Linux servers
  #   Switch by overriding the command: e.g. COMPOSE_CELERY_POOL=prefork
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-celery
    networks:
      - sentinel-net
    command: celery -A core.celery_app worker --loglevel=info --pool=solo -Q celery
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - ZAP_API_URL=http://zap:8080
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Lab mode: allow scanning private IPs (student machines on local network).
      # NEVER set true on internet-facing deployments.
      - ALLOW_PRIVATE_TARGETS=true
      - WAZUH_API_URL=https://host.docker.internal:55000
      - WAZUH_VERIFY_SSL=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    # Celery workers don't serve HTTP — use inspect ping instead of HTTP healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ── Celery Beat Scheduler (periodic tasks — Wazuh polling every 30s) ────────
  # Beat must run as a single instance — never scale this service.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-celery-beat
    networks:
      - sentinel-net
    command: celery -A core.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler --pidfile /tmp/celerybeat.pid
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - ZAP_API_URL=http://zap:8080
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ALLOW_PRIVATE_TARGETS=true
      - WAZUH_API_URL=https://host.docker.internal:55000
      - WAZUH_VERIFY_SSL=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    # pidfile written by beat on startup; kill -0 checks the process is alive without signalling it
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery SOC Worker (dedicated queue for Wazuh poll + AI triage) ─────────
  # Isolated from the scan worker so poll/triage tasks cannot starve run_scan.
  # Beat must target this worker — all soc-queue tasks route here via task_routes.
  celery-soc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-celery-soc
    networks:
      - sentinel-net
    command: celery -A core.celery_app worker --loglevel=info --pool=solo -Q soc
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ALLOW_PRIVATE_TARGETS=true
      - WAZUH_API_URL=https://host.docker.internal:55000
      - WAZUH_VERIFY_SSL=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ── React Frontend (nginx serving the Vite static build) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-frontend
    networks:
      - sentinel-net
    restart: unless-stopped

  # ── OWASP ZAP (DAST scanner daemon) ──────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: cyber-sentinel-zap
    networks:
      - sentinel-net
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    # ZAP is accessed internally by the backend via http://zap:8080
    # No host port needed — backend reaches it over the Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── nginx Reverse Proxy + Load Balancer ──────────────────────────────────
  # Single entry point for the whole app (HTTP only):
  #   http://localhost:8888  → routes / to frontend, /api + /ws to backend
  # Port 8888 avoids conflict with Wazuh (80/443) and backend (8000).
  # To scale: add more backend/frontend instances under upstream blocks in nginx.conf
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cyber-sentinel-nginx
    networks:
      - sentinel-net
    ports:
      - "8888:80"           # http://localhost:8888  ← open this in your browser
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started   # started is enough — nginx retries upstreams naturally
    restart: unless-stopped

  # ── Wazuh Forwarder ──────────────────────────────────────────────────────
  # Reads Wazuh alerts from the host log file and POSTs them to the backend.
  # Runs inside Docker but accesses the host's /var/ossec/logs via bind mount.
  # Token: generate in Settings → copy → paste into .env as WAZUH_WEBHOOK_TOKEN
  forwarder:
    image: python:3.11-alpine
    container_name: cyber-sentinel-forwarder
    networks:
      - sentinel-net
    command: python3 /app/scripts/wazuh_forwarder.py
    environment:
      - CYBER_SENTINEL_URL=http://backend:8000
      - WAZUH_WEBHOOK_TOKEN=${WAZUH_WEBHOOK_TOKEN:-}
      - TENANT_GROUP=${WAZUH_TENANT_GROUP:-tenant_lab}
      - MIN_LEVEL=${WAZUH_MIN_LEVEL:-3}
      - ALERTS_FILE=/var/ossec/logs/alerts/alerts.json
      - STATE_FILE=/state/wazuh_forwarder.state
    volumes:
      - ./scripts:/app/scripts:ro          # forwarder script (read-only)
      - /var/ossec/logs:/var/ossec/logs:ro # host Wazuh logs (read-only)
      - forwarder_state:/state             # persists read offset across restarts
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Wazuh All-in-One (optional — docker-compose --profile wazuh up -d) ───
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    container_name: cyber-sentinel-wazuh
    networks:
      - sentinel-net
    profiles: ["wazuh"]
    hostname: wazuh.manager
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
      - "514:514/udp"
    environment:
      WAZUH_MANAGER_CONFIG: |
        <ossec_config>
          <global>
            <jsonout_output>yes</jsonout_output>
            <alerts_log>yes</alerts_log>
            <logall>no</logall>
          </global>
        </ossec_config>
    volumes:
      - wazuh_api_config:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
    restart: unless-stopped

volumes:
  mongo_data:
  forwarder_state:
  wazuh_api_config:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
