# ============================================================
# HorizontalPodAutoscalers
# ============================================================
# backend: scales 2→8 replicas when CPU > 70% or memory > 80%
# celery:  scales 2→10 replicas when CPU > 60% (scan-intensive)
#
# Requires metrics-server installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# ============================================================

# Backend HPA — scale API replicas under concurrent request load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cyber-sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down (prevents thrash)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # Remove at most 1 pod per minute
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # Add at most 2 pods per minute
---
# Celery Worker HPA — scale scan workers under heavy scan load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-hpa
  namespace: cyber-sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # Lower threshold — scan tasks are CPU-intensive
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600   # 10 min — scans take time, don't kill workers mid-scan
    scaleUp:
      stabilizationWindowSeconds: 0    # Scale up immediately when load spikes
