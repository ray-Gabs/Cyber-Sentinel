# ============================================================
# Nginx Ingress — routes external traffic into the cluster
# ============================================================
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/...
#
# TLS:
#   Uses cert-manager with Let's Encrypt for automatic TLS.
#   Install cert-manager: https://cert-manager.io/docs/installation/kubectl/
#   Then create a ClusterIssuer pointing at letsencrypt-prod.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyber-sentinel-ingress
  namespace: cyber-sentinel
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Security headers via nginx ingress annotations
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rate limiting at ingress level (coarse-grained, before reaching the app)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # WebSocket support for /ws/* paths
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Body size limit — scan uploads are small; 8MB is generous
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  tls:
    - hosts:
        - cyber-sentinel.yourdomain.com
      secretName: cyber-sentinel-tls
  rules:
    - host: cyber-sentinel.yourdomain.com
      http:
        paths:
          # API — route to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # WebSocket — route to backend (same service, different upgrade handling)
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Everything else — frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
