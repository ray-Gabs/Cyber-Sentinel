# ============================================================
# K8s Secret — sensitive env vars
# ============================================================
# NEVER commit real values. Populate with:
#   kubectl create secret generic cyber-sentinel-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 48) \
#     --from-literal=CLAUDE_API_KEY=sk-ant-... \
#     -n cyber-sentinel
#
# Or use External Secrets Operator + AWS Secrets Manager / Vault.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: cyber-sentinel-secrets
  namespace: cyber-sentinel
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  CLAUDE_API_KEY: ""
  GROQ_API_KEY: ""
  WAZUH_WEBHOOK_TOKEN: "REPLACE_ME"
  NVD_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  S3_BUCKET: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
