apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cyber-sentinel
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # Always keep at least 2 replicas up during deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Run as non-root (matches Dockerfile USER sentinel uid=1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/ray-gabs/cyber-sentinel-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cyber-sentinel-config
            - secretRef:
                name: cyber-sentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Drop all capabilities — containers have no Linux capabilities by default
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # xhtml2pdf needs /tmp writes
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: cyber-sentinel
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
