apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-sentinel-config
  namespace: cyber-sentinel
data:
  # Non-secret runtime config — secrets go in Secret, not here
  LOG_LEVEL: "INFO"
  AI_PROVIDER: "claude"
  MONGODB_DB_NAME: "cyber_sentinel"
  # Use K8s service names for inter-service communication
  MONGODB_URI: "mongodb://mongo-service:27017"
  REDIS_URL: "redis://redis-service:6379/0"
  ZAP_API_URL: "http://zap-service:8080"
  FRONTEND_URL: "https://cyber-sentinel.yourdomain.com"
