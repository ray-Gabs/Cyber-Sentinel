apiVersion: apps/v1
kind: Deployment
metadata:
  name: zap
  namespace: cyber-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zap
  template:
    metadata:
      labels:
        app: zap
    spec:
      containers:
      - name: zap
        image: ghcr.io/zaproxy/zaproxy:stable
        command:
        - zap.sh
        - -daemon
        - -host
        - "0.0.0.0"
        - -port
        - "8080"
        - -config
        - api.addrs.addr.name=.*
        - -config
        - api.addrs.addr.regex=true
        - -config
        - api.disablekey=true
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "800Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /JSON/core/view/version/
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
