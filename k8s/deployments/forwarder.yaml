apiVersion: apps/v1
kind: Deployment
metadata:
  name: forwarder
  namespace: cyber-sentinel
spec:
  replicas: 1    # NEVER increase — two forwarders = duplicate alert ingestion
  selector:
    matchLabels:
      app: forwarder
  template:
    metadata:
      labels:
        app: forwarder
    spec:
      containers:
      - name: forwarder
        image: python:3.11-alpine
        command: ["python3", "/app/scripts/wazuh_forwarder.py"]
        env:
        - name: CYBER_SENTINEL_URL
          value: "http://backend-svc:8000"
        - name: ALERTS_FILE
          value: "/var/ossec/logs/alerts/alerts.json"
        - name: STATE_FILE
          value: "/state/wazuh_forwarder.state"
        - name: MIN_LEVEL
          value: "3"
        - name: TENANT_GROUP
          value: "tenant_lab"
        envFrom:
        - secretRef:
            name: cyber-sentinel-secrets
        volumeMounts:
        - name: scripts
          mountPath: /app/scripts
          readOnly: true
        - name: wazuh-logs
          mountPath: /var/ossec/logs
          readOnly: true
        - name: forwarder-state
          mountPath: /state
        resources:
          requests:
            memory: "16Mi"
            cpu: "25m"
          limits:
            memory: "32Mi"
            cpu: "50m"
      volumes:
      - name: scripts
        hostPath:
          path: /opt/cyber-sentinel/scripts   # UPDATE to actual project scripts/ path on VM
          type: Directory
      - name: wazuh-logs
        hostPath:
          path: /var/ossec/logs
          type: Directory
      - name: forwarder-state
        persistentVolumeClaim:
          claimName: forwarder-state-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forwarder-state-pvc
  namespace: cyber-sentinel
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
