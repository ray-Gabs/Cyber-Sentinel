apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: cyber-sentinel
spec:
  replicas: 1    # NEVER increase — two Beat instances = duplicate task dispatch
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: cyber-sentinel/backend:latest
        imagePullPolicy: Never
        command:
        - celery
        - -A
        - core.celery_app
        - beat
        - --loglevel=info
        - --scheduler
        - celery.beat.PersistentScheduler
        - --pidfile
        - /tmp/celerybeat.pid
        envFrom:
        - configMapRef:
            name: cyber-sentinel-config
        - secretRef:
            name: cyber-sentinel-secrets
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
