# ============================================================
# docker-compose.prod.yml — Production Overrides
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file only overrides what differs from the dev compose.
# It does NOT replace docker-compose.yml — both files are merged.
# ============================================================

services:

  backend:
    # Production: no --reload, use compiled image code (no source volume)
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    volumes: []          # Remove dev source volume mount — use built image
    environment:
      PYTHONOPTIMIZE: "1"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  celery:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 512M

  celery-beat:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  zap:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  mongo:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
