# ============================================================
# nginx/nginx.conf — Cyber Sentinel HTTP Reverse Proxy
# ============================================================
# Upstream blocks allow easy horizontal scaling — add more
# backend/frontend instances under each upstream group.
# ============================================================

upstream backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend {
    server frontend:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;      # allow large scan payloads / report uploads

    # ── Security headers applied to all responses ───────────
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header X-XSS-Protection        "1; mode=block"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── WebSocket proxy (/ws) ───────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── API proxy (/api) ────────────────────────────────────
    location /api {
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        # Retry on upstream error so a restarting worker doesn't 502
        proxy_next_upstream   error timeout http_502 http_503;
    }

    # ── React SPA (everything else) ─────────────────────────
    location / {
        proxy_pass            http://frontend;
        proxy_http_version    1.1;
        proxy_set_header      Host      $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_next_upstream   error timeout http_502 http_503;
    }
}
