# ============================================================
# nginx/nginx.conf — Cyber Sentinel HTTP Reverse Proxy
# ============================================================
# Upstream blocks allow easy horizontal scaling — add more
# backend/frontend instances under each upstream group.
# ============================================================

upstream backend {
    least_conn;                    # route to least-busy backend instance
    server backend:8000;
    # server backend2:8000;        # uncomment to scale backend horizontally
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    # server frontend2:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;      # allow large scan payloads / report uploads

    # ── WebSocket proxy (/ws) ───────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── API proxy (/api) ────────────────────────────────────
    location /api {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── React SPA (everything else) ─────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
