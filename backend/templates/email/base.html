<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Cyber Sentinel{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #0A0A0F; }
    a { color: #3B82F6; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#0A0A0F;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0A0F;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:560px;" cellpadding="0" cellspacing="0">

          <!-- ── Header ── -->
          <tr>
            <td style="background-color:#0A0A0F;padding:0 0 24px;text-align:center;">
              <table cellpadding="0" cellspacing="0" style="display:inline-table;">
                <tr>
                  <td style="background:linear-gradient(135deg,#3B82F6,#1D4ED8);width:36px;height:36px;border-radius:8px;text-align:center;vertical-align:middle;">
                    <span style="color:#fff;font-size:18px;font-weight:900;line-height:36px;">&#9650;</span>
                  </td>
                  <td style="padding-left:10px;vertical-align:middle;">
                    <span style="color:#E2E8F0;font-size:18px;font-weight:700;letter-spacing:-0.3px;">Cyber Sentinel</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Card ── -->
          <tr>
            <td style="background-color:#111118;border:1px solid #2A2A3A;border-radius:16px;overflow:hidden;">

              <!-- Electric blue accent line -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="height:3px;background:linear-gradient(90deg,#3B82F6,#1D4ED8,transparent);line-height:3px;font-size:0;">&nbsp;</td>
                </tr>
              </table>

              <!-- Card body -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:36px 40px;">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ── Footer ── -->
          <tr>
            <td style="padding:24px 0 0;text-align:center;">
              <p style="margin:0;font-size:11px;color:#475569;">
                Cyber Sentinel &middot; Smart City and Cybersecurity Lab &middot; ITS
              </p>
              <p style="margin:4px 0 0;font-size:11px;color:#374151;">
                This is an automated message. Please do not reply.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
